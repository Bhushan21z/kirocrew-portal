# Kiro Crew public access stack.
#
#   browser --HTTPS--> Cloudflare edge --tunnel--> cloudflared
#     --> oauth2-proxy 127.0.0.1:4180 (Google login + email allowlist)
#           /         --> login-redirect (nginx) 127.0.0.1:${KC_NGINX_PORT}
#                           --> Kiro Crew gateway 127.0.0.1:${KIROCREW_PORT}
#           /kc-auth/ --> kc-auth token API 127.0.0.1:${KC_AUTH_PORT} (host service)
#
# All three containers use host networking: the gateway and kc-auth bind 127.0.0.1
# only, and a bridged container cannot reach the host's loopback.
#
# kc-auth is NOT in this file on purpose. It mints tokens with `kirocrew token`,
# and the gateway only accepts that from a process in its own Linux user and
# mount namespaces. A container always has its own mount namespace, so kc-auth
# runs on the host as a systemd user service instead (setup.sh installs it).
#
# Every value comes from .env. Run ./setup.sh rather than `docker compose up`
# directly: it validates .env and writes allowlist/authenticated-emails.txt first.

name: kc-remote-access

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: kc-oauth2-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET in .env}
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN:?set DOMAIN in .env}/oauth2/callback
      # A user is let in when their email is in the allowlist file OR ends in
      # @<one of ALLOWED_DOMAINS>. Empty ALLOWED_DOMAINS counts as unset, so the
      # file is then the only gate. setup.sh refuses `*`, which would let any
      # Google account in.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowlist/authenticated-emails.txt
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_DOMAINS:-}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_COOKIE_EXPIRE: ${OAUTH2_COOKIE_EXPIRE:-168h}
      OAUTH2_PROXY_COOKIE_REFRESH: ${OAUTH2_COOKIE_REFRESH:-1h}
      # One CSRF cookie per login attempt. With a single shared cookie, two
      # logins in one browser at once (two tabs, an expiring dashboard tab)
      # overwrite each other and the first fails with "CSRF token mismatch".
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 15m
      OAUTH2_PROXY_HTTP_ADDRESS: 127.0.0.1:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: http://127.0.0.1:${KC_NGINX_PORT:-4190}/,http://127.0.0.1:${KC_AUTH_PORT:-3000}/kc-auth/
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      # Forward the user's Google ID token as "Authorization: Bearer <jwt>".
      # kc-auth mints a token only after verifying it, so a request that did
      # not come through a real Google login cannot get one. oauth2-proxy
      # sets this header itself; a client cannot supply its own.
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${DOMAIN}
    volumes:
      # The FOLDER is mounted, not the file: a single-file mount pins the
      # file's inode, so a file replaced on save (setup.sh, sed -i, many
      # editors) would stay invisible to the running container. oauth2-proxy
      # watches the file and reloads it on every change.
      - ./allowlist:/etc/oauth2-proxy/allowlist:ro
    depends_on:
      - login-redirect

  # Between oauth2-proxy and the gateway: sends a browser with no dashboard
  # session to /kc-auth/login, so the plain URL needs no token. See
  # nginx/default.conf.template.
  login-redirect:
    image: nginx:1.27-alpine
    container_name: kc-login-redirect
    restart: unless-stopped
    network_mode: host
    environment:
      NGINX_ENVSUBST_FILTER: ^KC_
      KC_NGINX_LISTEN: 127.0.0.1:${KC_NGINX_PORT:-4190}
      KC_GATEWAY_UPSTREAM: 127.0.0.1:${KIROCREW_PORT:-5476}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kc-cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - oauth2-proxy
